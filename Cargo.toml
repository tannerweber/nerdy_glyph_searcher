[package]
name = "nerdy_glyph_searcher"
version = "0.1.0"
authors = ["Tanner Weber <tannerweber@proton.me>"]
edition = "2024"
description = "Search through font glyphs in the terminal."
readme = "README.md"
repository = "https://github.com/tannerweber/nerdy_glyph_searcher"
license = "AGPL-3.0-or-later"
keywords = ["font", "nerd", "terminal", "rice"]
build = "build.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
rayon = "1.12.0"
ttf-parser = "0.25.1"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Deny Panics
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
